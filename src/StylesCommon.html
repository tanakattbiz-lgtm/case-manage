<style>
  :root {
    --bg:            #F7F8FA;
    --panel:         #FFFFFF;
    --panel-muted:   #F3F4F6;
    --text:          #0F172A;
    --muted:         #64748B;
    --faint:         #94A3B8;
    --line:          #E2E8F0;
    --line-strong:   #CBD5E1;
    --select-bg:     #F1F5F9;
    --accent:        #0F172A;
    --accent-hover:  #334155;
    --accent-soft:   #F1F5F9;
    --danger:        #DC2626;
    --danger-soft:   #FEF2F2;
    --success:       #16A34A;
    --success-soft:  #F0FDF4;
    --warning:       #D97706;
    --warning-soft:  #FFFBEB;
    --info:          #2563EB;
    --info-soft:     #EFF6FF;
    --shadow-sm:     0 1px 3px rgba(15, 23, 42, 0.06), 0 1px 2px rgba(15, 23, 42, 0.04);
    --shadow-md:     0 4px 16px rgba(15, 23, 42, 0.08);
    --shadow-lg:     0 12px 32px rgba(15, 23, 42, 0.12);
    --shadow-glow:   none;
    --radius-sm:     6px;
    --radius-md:     8px;
    --radius-lg:     12px;
    --font-body:     'Inter', 'Noto Sans JP', system-ui, -apple-system, sans-serif;
    --font-mono:     'SFMono-Regular', Menlo, Consolas, monospace;
    --ease-snap:     150ms cubic-bezier(0.4, 0, 0.2, 1);
    --ease-flow:     280ms cubic-bezier(0.4, 0, 0.2, 1);
    --content-padding: 28px;
    --mobile-padding:  16px;
    /* Legacy aliases */
    --transition-snappy: var(--ease-snap);
    --transition-smooth: var(--ease-flow);
    /* Enterprise/compat aliases */
    --color-bg:            var(--bg);
    --color-surface:       var(--panel);
    --color-surface-muted: var(--panel-muted);
    --color-text:          var(--text);
    --color-text-subtle:   var(--muted);
    --color-text-muted:    var(--faint);
    --color-border:        var(--line);
    --color-border-strong: var(--line-strong);
    --color-hover:         var(--panel-muted);
    --color-selected:      var(--select-bg);
    --color-focus:         var(--accent);
    --color-success:       var(--success);
    --color-success-bg:    var(--success-soft);
    --color-warning:       var(--warning);
    --color-warning-bg:    var(--warning-soft);
    --color-error:         var(--danger);
    --color-error-bg:      var(--danger-soft);
    --color-info:          var(--info);
    --color-info-bg:       var(--info-soft);
    --color-black:         var(--accent);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    font-variant-numeric: tabular-nums;
  }

  body {
    min-height: 100svh;
    line-height: 1.6;
  }

  body.modal-open,
  body.drawer-open { overflow: hidden; }

  [hidden] { display: none !important; }

  img { max-width: 100%; display: block; }

  button, input, textarea, select { font: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.45; }

  .btn.is-loading {
    pointer-events: none;
    position: relative;
  }
  .btn.is-loading::before {
    content: '';
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 999px;
    border: 2px solid currentColor;
    border-top-color: transparent;
    opacity: 0.7;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }

  p {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.6;
  }

  h1, h2, h3, h4 {
    margin: 0;
    letter-spacing: -0.01em;
    line-height: 1.3;
  }

  /* ── Icon sprite ── */
  .icon-sprite { position: absolute; width: 0; height: 0; overflow: hidden; }

  .icon {
    width: 1em;
    height: 1em;
    display: inline-block;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.75;
    flex-shrink: 0;
  }

  .icon-16 { font-size: 16px; }
  .icon-20 { font-size: 20px; }
  .icon-24 { font-size: 24px; }

  /* ── Surface ── */
  .surface {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-sm);
  }

  /* ── Typography ── */
  .overline {
    margin-bottom: 4px;
    color: var(--faint);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .mono-text {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Buttons ── */
  .btn,
  .icon-btn,
  .segment-btn,
  .nav-btn,
  .nav-tab {
    min-height: 34px;
    border: 0;
    transition:
      background var(--ease-snap),
      color var(--ease-snap),
      border-color var(--ease-snap),
      box-shadow var(--ease-snap);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 0 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    white-space: nowrap;
    font-size: 13px;
    font-weight: 500;
  }

  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #FFFFFF;
  }

  .btn-primary:hover:not(:disabled) {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
  }

  .btn-secondary {
    background: var(--panel);
    border: 1px solid var(--line-strong);
    color: var(--text);
  }

  .btn-secondary:hover:not(:disabled) {
    background: var(--bg);
  }

  .btn-ghost {
    background: transparent;
    color: var(--muted);
    border-color: transparent;
  }

  .btn-ghost:hover:not(:disabled) {
    background: var(--panel-muted);
    color: var(--text);
  }

  .btn-danger {
    background: var(--panel);
    color: var(--danger);
    border: 1px solid #FECACA;
  }

  .btn-danger:hover:not(:disabled) {
    background: var(--danger-soft);
    border-color: #FCA5A5;
  }

  .btn-small {
    min-height: 28px;
    padding: 0 9px;
    font-size: 12px;
  }

  .btn-block { width: 100%; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 34px;
    height: 34px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    border: 0;
  }

  .icon-btn:hover:not(:disabled) {
    background: var(--bg);
    color: var(--text);
  }

  .btn:focus-visible,
  .icon-btn:focus-visible,
  .segment-btn:focus-visible,
  .nav-btn:focus-visible,
  .nav-tab:focus-visible,
  .input:focus,
  .textarea:focus,
  .select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
    box-shadow: none;
  }

  .toolbar-row {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* ── Form ── */
  .field { display: grid; gap: 5px; }

  .field-label {
    color: var(--text);
    font-size: 12px;
    font-weight: 600;
  }

  .field-label-sub {
    font-weight: 400;
    color: var(--muted);
  }

  .required-dot {
    display: inline-flex;
    align-items: center;
    margin-left: 3px;
    color: var(--danger);
    font-size: 11px;
    font-weight: 700;
  }

  .input,
  .textarea,
  .select {
    width: 100%;
    min-height: 34px;
    padding: 0 10px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--panel);
    color: var(--text);
    font-size: 13px;
    transition: border-color var(--ease-snap);
  }

  .input:hover,
  .textarea:hover,
  .select:hover { border-color: #94A3B8; }

  .input::placeholder,
  .textarea::placeholder { color: var(--faint); }

  .textarea {
    min-height: 96px;
    padding: 8px 10px;
    resize: vertical;
    line-height: 1.6;
  }

  .select {
    appearance: none;
    background-image:
      linear-gradient(45deg, transparent 50%, var(--muted) 50%),
      linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position:
      calc(100% - 13px) calc(50% - 2px),
      calc(100% - 8px)  calc(50% - 2px);
    background-size: 5px 5px, 5px 5px;
    background-repeat: no-repeat;
    padding-right: 28px;
  }

  .field-error {
    min-height: 16px;
    color: var(--danger);
    font-size: 11px;
  }

  .check-field {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 13px;
  }

  .check-field input {
    width: 15px;
    height: 15px;
    accent-color: var(--accent);
  }

  .compact-field { min-width: 88px; }

  .field-grid   { display: grid; gap: 12px; }
  .field-grid-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .field-grid-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .field-span-2 { grid-column: span 2; }

  .form-stack { display: grid; gap: 14px; }

  .form-section {
    display: grid;
    gap: 12px;
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .form-actions,
  .modal-actions {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    padding-top: 14px;
    border-top: 1px solid var(--line);
  }

  .inline-note,
  .inline-notice {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 9px 11px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    line-height: 1.55;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--line);
  }

  .inline-notice.info,
  .status-banner.info {
    background: var(--info-soft);
    color: var(--info);
    border-color: #BFDBFE;
  }

  .inline-notice.success {
    background: var(--success-soft);
    color: var(--success);
    border-color: #BBF7D0;
  }

  .inline-notice.error,
  .status-banner.error {
    background: var(--danger-soft);
    color: var(--danger);
    border-color: #FECACA;
  }

  .status-banner.warning {
    background: var(--warning-soft);
    color: var(--warning);
    border-color: #FDE68A;
  }

  .status-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    margin: 0 var(--content-padding);
    border-radius: var(--radius-md);
    font-size: 13px;
    border: 1px solid transparent;
  }

  .status-banner-copy { display: grid; gap: 1px; flex: 1; }
  .status-banner strong { font-size: 13px; }

  /* ── Status chips & pills ── */
  .status-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    min-height: 26px;
    padding: 0 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 500;
    border: 1px solid transparent;
  }

  .status-chip.online  { background: var(--success-soft); color: var(--success); border-color: #BBF7D0; }
  .status-chip.offline { background: var(--warning-soft); color: var(--warning); border-color: #FDE68A; }
  .status-chip.error   { background: var(--danger-soft);  color: var(--danger);  border-color: #FECACA; }

  .chip,
  .status-pill,
  .result-pill {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    min-height: 20px;
    padding: 0 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }

  .chip { background: var(--bg); color: var(--text); border: 1px solid var(--line); }

  .status-pill.lead      { background: #EFF6FF; color: #1D4ED8; }
  .status-pill.active    { background: #F0F9FF; color: #0369A1; }
  .status-pill.completed { background: #F0FDF4; color: #15803D; }
  .status-pill.pending,
  .status-pill.locked    { background: #FFFBEB; color: #B45309; }
  .status-pill.stopped,
  .status-pill.disabled  { background: #FEF2F2; color: #B91C1C; }

  .result-pill.SUCCESS { background: #F0FDF4; color: #15803D; }
  .result-pill.FAILURE { background: #FEF2F2; color: #B91C1C; }

  /* ── Table ── */
  .table-wrap {
    overflow: auto;
    max-height: min(64vh, 720px);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
  }

  .data-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 13px;
    background: var(--panel);
  }

  .data-table th,
  .data-table td {
    padding: 10px 14px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid var(--line);
  }

  .data-table thead th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--bg);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .data-table tbody tr { transition: background var(--ease-snap); }

  .data-table tbody tr:hover td { background: var(--bg); }

  .data-table tbody tr.is-selected td { background: var(--select-bg); }

  .data-table tbody tr:last-child td { border-bottom: 0; }

  .num { text-align: right !important; font-family: var(--font-mono); }
  .actions-cell { width: 1%; white-space: nowrap; text-align: right !important; }

  .table-caption { color: var(--faint); font-size: 12px; }

  .list-actions {
    display: flex;
    justify-content: flex-end;
    gap: 6px;
    flex-wrap: wrap;
  }

  /* ── Empty & skeleton ── */
  .empty-state,
  .state-block {
    display: grid;
    place-items: center;
    gap: 8px;
    min-height: 180px;
    padding: 36px 24px;
    border: 1px dashed var(--line-strong);
    border-radius: var(--radius-lg);
    background: var(--panel);
    text-align: center;
  }

  .state-block strong { font-size: 14px; }

  .state-block p,
  .empty-state span { max-width: 380px; }

  .skeleton { display: grid; gap: 10px; }

  .skeleton-line {
    height: 11px;
    border-radius: 999px;
    background: linear-gradient(90deg, #F1F5F9 25%, #E2E8F0 50%, #F1F5F9 75%);
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }

  .skeleton-line.short { width: 44%; }
  .skeleton-line.mid   { width: 66%; }

  .skeleton-card {
    display: grid;
    gap: 12px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    background: var(--panel);
    box-shadow: var(--shadow-sm);
  }

  /* ── 検索中インジケーター ── */
  .search-progress {
    height: 2px;
    margin: -6px 0 14px;
    border-radius: 999px;
    background: var(--accent-soft);
    overflow: hidden;
    opacity: 0;
    transition: opacity 160ms ease;
  }

  .is-busy > .search-progress { opacity: 1; }

  .search-progress::before {
    content: '';
    display: block;
    width: 38%;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
    transform: translateX(-120%);
  }

  .is-busy > .search-progress::before {
    animation: search-progress-slide 1.1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
  }

  .is-busy .data-table tbody,
  .is-busy .mobile-card-list {
    opacity: 0.5;
    transition: opacity 160ms ease;
    pointer-events: none;
  }

  .search-status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }

  .search-status::before {
    content: '';
    width: 12px;
    height: 12px;
    border-radius: 999px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.7s linear infinite;
  }

  @keyframes search-progress-slide {
    0%   { transform: translateX(-120%); }
    60%  { transform: translateX(260%); }
    100% { transform: translateX(260%); }
  }

  /* ── Modal ── */
  .modal-shell {
    position: fixed;
    inset: 0;
    z-index: 80;
    display: grid;
    place-items: center;
    padding: 20px;
    background: rgba(15, 23, 42, 0.28);
  }

  #messageDialog { z-index: 110; }
  #confirmDialog { z-index: 120; }

  .modal-panel {
    width: min(880px, calc(100vw - 32px));
    max-height: calc(100svh - 40px);
    overflow: auto;
    padding: 24px;
    border-radius: var(--radius-lg);
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: var(--shadow-lg);
    animation: modal-enter 160ms cubic-bezier(0.4, 0, 0.2, 1);
  }

  @keyframes modal-enter {
    from { opacity: 0; transform: scale(0.97) translateY(8px); }
    to   { opacity: 1; transform: scale(1)    translateY(0); }
  }

  .modal-compact    { width: min(500px, calc(100vw - 32px)); }
  .modal-form-panel { width: min(820px, calc(100vw - 32px)); }

  .modal-head {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--line);
  }

  .modal-head h3 { font-size: 16px; font-weight: 600; }

  .assist-content { display: grid; gap: 10px; margin-bottom: 14px; }

  .assist-content article {
    padding: 13px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--bg);
    font-size: 13px;
    line-height: 1.55;
  }

  /* ── Loading overlay ── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 90;
    display: grid;
    place-items: center;
    background: rgba(247, 248, 250, 0.88);
  }

  .loading-panel {
    display: grid;
    gap: 10px;
    min-width: 220px;
    max-width: 300px;
    padding: 22px;
    text-align: center;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-md);
  }

  .spinner {
    width: 28px;
    height: 28px;
    margin: 0 auto;
    border-radius: 999px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.75s linear infinite;
  }

  /* ── Toast ── */
  .toast-stack {
    position: fixed;
    right: 18px;
    top: 18px;
    z-index: 100;
    display: grid;
    gap: 8px;
    width: min(320px, calc(100vw - 32px));
  }

  .toast {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 10px;
    align-items: start;
    padding: 11px 13px;
    border-radius: var(--radius-md);
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-left: 3px solid var(--line-strong);
    box-shadow: var(--shadow-md);
    font-size: 13px;
    animation: toast-in 150ms ease;
  }

  .toast.success { border-left-color: var(--success); }
  .toast.error   { border-left-color: var(--danger); }
  .toast.warning { border-left-color: var(--warning); }

  /* ── Animations ── */
  @keyframes shimmer {
    from { background-position: 200% 0; }
    to   { background-position: -200% 0; }
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  @keyframes toast-in {
    from { opacity: 0; transform: translateX(6px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  /* ── Responsive ── */
  @media (max-width: 920px) {
    .modal-shell { padding: 10px; }

    .modal-panel,
    .modal-form-panel,
    .modal-compact {
      width: calc(100vw - 20px);
      max-height: calc(100svh - 20px);
      padding: 16px;
      border-radius: var(--radius-lg);
    }

    .toast-stack {
      right: 10px;
      left: 10px;
      top: 10px;
      width: auto;
    }
  }

  @media (max-width: 640px) {
    .field-grid-2,
    .field-grid-3 { grid-template-columns: 1fr; }

    .field-span-2 { grid-column: auto; }

    .form-actions,
    .modal-actions { justify-content: stretch; }

    .form-actions .btn,
    .modal-actions .btn { width: 100%; }
  }
</style>
