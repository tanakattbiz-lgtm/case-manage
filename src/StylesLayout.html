<style>
  /* ── Sidebar ── */
  .sidebar {
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    width: 228px;
    height: 100svh;
    padding: 14px 10px;
    background: var(--panel);
    border-right: 1px solid var(--line);
    flex-shrink: 0;
  }

  .sidebar-top,
  .sidebar-bottom { display: grid; gap: 20px; }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 4px 8px;
  }

  .sidebar-brand-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    border-radius: 7px;
    background: var(--accent);
    color: #FFFFFF;
    flex-shrink: 0;
  }

  .sidebar-brand strong {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  .sidebar-brand span {
    font-size: 11px;
    color: var(--faint);
  }

  /* ── Nav ── */
  .sidebar-nav,
  .mobile-drawer-nav { display: grid; gap: 1px; }

  .nav-btn {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 8px;
    border-radius: var(--radius-sm);
    background: transparent;
    color: var(--muted);
    text-align: left;
    font-size: 13px;
  }

  .nav-btn:hover {
    background: var(--bg);
    color: var(--text);
  }

  .nav-btn.is-active {
    background: var(--bg);
    color: var(--text);
  }

  .nav-icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    border-radius: var(--radius-sm);
    background: transparent;
    flex-shrink: 0;
  }

  .nav-btn.is-active .nav-icon {
    background: var(--panel);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
    color: var(--accent);
  }

  .nav-copy { display: grid; gap: 0; flex: 1; }

  .nav-copy strong {
    font-size: 13px;
    font-weight: 500;
  }

  .nav-copy small {
    color: inherit;
    font-size: 11px;
    opacity: 0.65;
  }

  .nav-badge {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 18px;
    padding: 0 5px;
    border-radius: 999px;
    background: var(--panel-muted);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
  }

  /* ── Sidebar cards ── */
  .sidebar-card {
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--bg);
  }

  .sidebar-card-title {
    margin-bottom: 8px;
    color: var(--faint);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .sidebar-card-text {
    margin-top: 6px;
    font-size: 11px;
    color: var(--faint);
  }

  /* ── App shell ── */
  .shell {
    display: flex;
    min-height: 100svh;
    background: var(--bg);
  }

  .shell-main {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    min-height: 100svh;
  }

  /* ── Topbar ── */
  .topbar {
    position: sticky;
    top: 0;
    z-index: 20;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    padding: 0 28px;
    min-height: 52px;
    background: var(--panel);
    border-bottom: 1px solid var(--line);
  }

  .topbar-copy {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .page-title {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0;
    color: var(--text);
  }

  .page-subtitle {
    max-width: 440px;
    font-size: 12px;
    color: var(--faint);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .topbar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  /* ── User chip ── */
  .user-chip {
    display: grid;
    gap: 1px;
    padding: 5px 9px;
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    background: var(--bg);
  }

  .user-chip-vertical { margin-bottom: 16px; }

  .user-chip strong { font-size: 12px; font-weight: 600; }
  .user-chip span   { color: var(--faint); font-size: 11px; }

  /* ── Content area ── */
  .content-area {
    flex: 1;
    display: grid;
    gap: 18px;
    padding: 20px 28px 40px;
    align-content: start;
  }

  .view { display: none; gap: 18px; }
  .view.is-active { display: grid; }

  .view-header {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    align-items: flex-start;
    flex-wrap: wrap;
  }

  .view-header h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 3px;
  }

  /* ── Section card ── */
  .section-card {
    display: grid;
    gap: 14px;
    padding: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .section-space { margin-top: 4px; }

  .section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
  }

  .section-head h3,
  .section-head h4 {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 2px;
  }

  /* ── Segmented control ── */
  .segmented {
    display: inline-flex;
    padding: 3px;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    gap: 2px;
  }

  .segment-btn {
    padding: 0 10px;
    border-radius: 4px;
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }

  .segment-btn.is-active {
    background: var(--panel);
    color: var(--text);
    box-shadow: var(--shadow-sm);
    border: 1px solid var(--line);
  }

  /* ── Drawer backdrop ── */
  .drawer-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.32);
    z-index: 70;
  }

  /* ── Mobile – hidden by default ── */
  .mobile-header,
  .mobile-tabbar,
  .mobile-actionbar,
  .mobile-drawer { display: none; }

  .desktop-only { display: block; }
  .mobile-only  { display: none !important; }

  /* ── Responsive ── */
  @media (max-width: 920px) {
    :root { --content-padding: 20px; }

    .sidebar { display: none; }

    .mobile-header,
    .mobile-tabbar { display: flex; }

    .mobile-header {
      position: sticky;
      top: 0;
      z-index: 30;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      min-height: 50px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
      border-radius: 0;
    }

    .mobile-header-copy {
      display: grid;
      gap: 1px;
      text-align: center;
      flex: 1;
      margin: 0 10px;
    }

    .mobile-header-copy .overline { font-size: 10px; }

    .topbar {
      position: relative;
      top: auto;
      padding: 14px 20px 10px;
      background: transparent;
      border-bottom: 0;
      min-height: auto;
    }

    .topbar-copy {
      flex-direction: column;
      align-items: flex-start;
      gap: 2px;
    }

    .topbar-actions { display: none; }

    .mobile-drawer {
      position: fixed;
      top: 0;
      left: 0;
      z-index: 75;
      display: grid;
      align-content: start;
      gap: 14px;
      width: min(80vw, 300px);
      height: 100svh;
      padding: 18px 12px calc(18px + env(safe-area-inset-bottom));
      background: var(--panel);
      border-right: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      border-radius: 0;
    }

    .mobile-drawer-head,
    .mobile-drawer-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .mobile-drawer-foot {
      display: grid;
      gap: 8px;
      margin-top: auto;
    }

    .mobile-tabbar {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(8px + env(safe-area-inset-bottom));
      z-index: 40;
      align-items: center;
      justify-content: space-around;
      gap: 4px;
      padding: 5px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
    }

    .nav-tab {
      display: grid;
      place-items: center;
      gap: 3px;
      flex: 1;
      min-height: 44px;
      border-radius: var(--radius-sm);
      background: transparent;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
    }

    .nav-tab.is-active {
      background: var(--bg);
      color: var(--text);
    }

    .status-banner { margin: 0 16px; }

    .content-area {
      gap: 14px;
      padding: 12px 20px 110px;
    }

    .desktop-only { display: none !important; }
    .mobile-only  { display: block !important; }

    .mobile-actionbar {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: calc(76px + env(safe-area-inset-bottom));
      z-index: 39;
      display: none;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      box-shadow: var(--shadow-md);
    }

    .mobile-actionbar.is-visible { display: block; }
  }

  @media (max-width: 640px) {
    :root { --content-padding: 16px; }

    .view-header h2 { font-size: 18px; }
    .section-card   { padding: 14px; }
    .topbar         { padding-inline: 16px; }
    .status-banner  { margin-inline: 16px; }
    .content-area   { padding-inline: 16px; }
  }
</style>
