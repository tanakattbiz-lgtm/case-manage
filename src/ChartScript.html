<script>
  (function (App) {
    var instances = {};
    var palette = ['#111827', '#6B7280', '#9CA3AF', '#166534', '#92400E', '#1E40AF', '#991B1B'];

    function money(value) {
      return '¥' + Math.round(Number(value) || 0).toLocaleString('ja-JP');
    }

    function ensureChart(canvasId, config) {
      var canvas = App.ui.byId(canvasId);
      if (!canvas || !window.Chart) return null;
      if (instances[canvasId]) {
        if (instances[canvasId].config.type === config.type) {
          instances[canvasId].data = config.data;
          instances[canvasId].options = config.options;
          instances[canvasId].update();
          return instances[canvasId];
        }
        instances[canvasId].destroy();
      }
      instances[canvasId] = new Chart(canvas, config);
      return instances[canvasId];
    }

    function defaultOptions(extra) {
      return Object.assign({
        responsive: true,
        maintainAspectRatio: false,
        animation: { duration: 180 },
        plugins: {
          legend: {
            position: 'bottom',
            labels: { boxWidth: 10, boxHeight: 10, color: '#6B7280', font: { size: 12 } }
          },
          tooltip: {
            callbacks: {
              label: function (context) {
                var label = context.dataset && context.dataset.label ? context.dataset.label + ': ' : '';
                return label + (context.dataset && context.dataset.money ? money(context.raw) : App.helpers.number(context.raw));
              }
            }
          }
        },
        scales: {
          x: { grid: { color: '#F3F4F6' }, ticks: { color: '#6B7280' } },
          y: { grid: { color: '#E5E7EB' }, ticks: { color: '#6B7280' } }
        }
      }, extra || {});
    }

    App.charts = {
      renderMoneyCombo: function (canvasId, items) {
        ensureChart(canvasId, {
          type: 'bar',
          data: {
            labels: (items || []).map(function (item) { return String(item.month || '').replace('/', '.'); }),
            datasets: [
              { type: 'bar', label: '売上', data: (items || []).map(function (item) { return item.sales || 0; }), backgroundColor: '#111827', borderRadius: 4, money: true },
              { type: 'line', label: '粗利', data: (items || []).map(function (item) { return item.profit || 0; }), borderColor: '#166534', backgroundColor: '#166534', tension: 0.32, pointRadius: 2, money: true }
            ]
          },
          options: defaultOptions({
            scales: {
              x: { grid: { display: false }, ticks: { color: '#6B7280' } },
              y: { grid: { color: '#E5E7EB' }, ticks: { color: '#6B7280', callback: money } }
            }
          })
        });
      },

      renderDoughnut: function (canvasId, items) {
        ensureChart(canvasId, {
          type: 'doughnut',
          data: {
            labels: (items || []).map(function (item) { return item.label; }),
            datasets: [{ data: (items || []).map(function (item) { return item.count || 0; }), backgroundColor: palette, borderColor: '#FFFFFF', borderWidth: 2 }]
          },
          options: defaultOptions({ cutout: '68%', scales: {} })
        });
      },

      renderHorizontalBars: function (canvasId, items, valueKey) {
        ensureChart(canvasId, {
          type: 'bar',
          data: {
            labels: (items || []).map(function (item) { return item.label || item.name; }),
            datasets: [{ label: valueKey === 'count' ? '件数' : '売上', data: (items || []).map(function (item) { return item[valueKey || 'sales'] || 0; }), backgroundColor: '#111827', borderRadius: 4, money: valueKey !== 'count' }]
          },
          options: defaultOptions({
            indexAxis: 'y',
            scales: {
              x: { grid: { color: '#E5E7EB' }, ticks: { color: '#6B7280', callback: money } },
              y: { grid: { display: false }, ticks: { color: '#6B7280' } }
            }
          })
        });
      },

      renderPipeline: function (canvasId, items) {
        ensureChart(canvasId, {
          type: 'bar',
          data: {
            labels: (items || []).map(function (item) { return item.label; }),
            datasets: [{ label: 'パイプライン', data: (items || []).map(function (item) { return item.sales || 0; }), backgroundColor: palette, borderRadius: 4, money: true }]
          },
          options: defaultOptions({
            scales: {
              x: { grid: { display: false }, ticks: { color: '#6B7280' } },
              y: { grid: { color: '#E5E7EB' }, ticks: { color: '#6B7280', callback: money } }
            }
          })
        });
      },

      renderTrend: function (targetId, items) {
        var target = App.ui.byId(targetId);
        if (!items || !items.length) {
          target.innerHTML = App.ui.renderStateBlock('データがありません。', '案件が登録されると月次推移が表示されます。', 'info');
          return;
        }

        target.innerHTML = '<canvas id="' + App.helpers.escape(targetId + 'Canvas') + '"></canvas>';
        this.renderMoneyCombo(targetId + 'Canvas', items);
        return;

        var width = 760;
        var height = 320;
        var padding = { top: 24, right: 20, bottom: 44, left: 54 };
        var chartWidth = width - padding.left - padding.right;
        var chartHeight = height - padding.top - padding.bottom;
        var max = Math.max.apply(null, items.map(function (item) {
          return Math.max(item.sales || 0, item.profit || 0, item.activeSales || 0, item.proposalSales || 0);
        }).concat([1]));

        function point(index, value) {
          var x = padding.left + (chartWidth / Math.max(items.length - 1, 1)) * index;
          var y = padding.top + chartHeight - ((Number(value) || 0) / max) * chartHeight;
          return x + ',' + y;
        }

        var salesLine = items.map(function (item, index) { return point(index, item.sales); }).join(' ');
        var profitLine = items.map(function (item, index) { return point(index, item.profit); }).join(' ');
        var labels = items.map(function (item, index) {
          var x = padding.left + (chartWidth / Math.max(items.length - 1, 1)) * index;
          return '<text x="' + x + '" y="' + (height - 12) + '" text-anchor="middle" font-size="11" fill="#64748b">' + App.helpers.escape(item.month.replace('/', '.')) + '</text>';
        }).join('');
        var grid = [0.25, 0.5, 0.75, 1].map(function (ratio) {
          var y = padding.top + chartHeight - chartHeight * ratio;
          return '<line x1="' + padding.left + '" y1="' + y + '" x2="' + (width - padding.right) + '" y2="' + y + '" stroke="rgba(15,23,42,0.08)" stroke-dasharray="4 6" />';
        }).join('');

        target.innerHTML = ''
          + '<svg viewBox="0 0 ' + width + ' ' + height + '" width="100%" height="100%" role="img" aria-label="売上と利益の推移">'
          + grid
          + '<line x1="' + padding.left + '" y1="' + (padding.top + chartHeight) + '" x2="' + (width - padding.right) + '" y2="' + (padding.top + chartHeight) + '" stroke="rgba(15,23,42,0.18)" />'
          + '<polyline fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="' + salesLine + '" />'
          + '<polyline fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" points="' + profitLine + '" />'
          + labels
          + '</svg>'
          + '<div class="stats-row"><span><strong style="color:#3b82f6;">■</strong> 売上</span><span><strong style="color:#16a34a;">■</strong> 利益</span></div>';
      }
    };
  })(window.App);
</script>
