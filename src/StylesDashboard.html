<style>
  /* ── KPI grid ── */
  .kpi-grid   { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  .kpi-grid-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .kpi-grid-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }

  .metric-card {
    display: grid;
    gap: 8px;
    padding: 18px;
    position: relative;
    overflow: hidden;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
  }

  .metric-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--line-strong);
    opacity: 0.5;
  }

  .metric-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }

  .metric-card-header strong {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .metric {
    font-family: var(--font-mono);
    font-size: clamp(20px, 2.2vw, 26px);
    font-weight: 700;
    line-height: 1.1;
    color: var(--text);
    letter-spacing: -0.02em;
  }

  .metric-card footer {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  /* ── Delta badge ── */
  .delta-badge {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    white-space: nowrap;
  }

  .delta-up   { background: var(--success-soft); color: var(--success); }
  .delta-down { background: var(--danger-soft);  color: var(--danger); }
  .delta-flat { background: var(--bg);           color: var(--muted);  border: 1px solid var(--line); }

  /* ── Dashboard grids ── */
  .dashboard-grid          { display: grid; gap: 14px; }
  .dashboard-grid-primary  { grid-template-columns: minmax(0, 1.4fr) minmax(260px, 0.9fr); }
  .dashboard-grid-secondary,
  .dashboard-grid-tertiary { grid-template-columns: repeat(2, minmax(0, 1fr)); }

  /* ── Section card (dashboard override) ── */
  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--faint);
    margin-bottom: 2px;
  }

  /* ── Chart shell ── */
  .chart-shell { height: 260px; position: relative; overflow: hidden; }

  .chart-canvas-wrap { position: relative; height: 220px; }

  .chart-canvas-wrap canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 14px;
  }

  /* ── Attention bar ── */
  .attention-bar {
    display: grid;
    gap: 10px;
    padding: 16px;
    border-radius: var(--radius-md);
    border: 1px solid #FDE68A;
    background: var(--warning-soft);
  }

  .attention-bar-header {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .attention-bar-header strong {
    font-size: 13px;
    font-weight: 700;
    color: var(--warning);
  }

  .attention-bar-header span {
    font-size: 12px;
    color: var(--muted);
  }

  .attention-items {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 8px;
  }

  .attention-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 12px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--panel);
    min-width: 0;
  }

  .attention-item-body { flex: 1; min-width: 0; }

  .attention-item-name {
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .attention-item-sub {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 2px;
  }

  .days-badge {
    display: inline-flex;
    align-items: center;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
    background: var(--warning-soft);
    color: var(--warning);
    border: 1px solid #FDE68A;
    white-space: nowrap;
  }

  /* ── Status grid ── */
  .status-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
  }

  .status-card {
    display: grid;
    gap: 5px;
    width: 100%;
    padding: 12px 14px;
    border-radius: var(--radius-md);
    border: 1px solid var(--line);
    background: var(--bg);
    color: var(--text);
    text-align: left;
    transition: background var(--ease-snap), border-color var(--ease-snap);
  }

  .status-card:hover {
    background: var(--panel);
    border-color: var(--line-strong);
  }

  .status-card-label {
    font-size: 11px;
    color: var(--muted);
    font-weight: 600;
  }

  .status-card .metric { font-size: 20px; }

  .status-card-sales {
    font-size: 11px;
    font-family: var(--font-mono);
    color: var(--muted);
  }

  /* ── Funnel ── */
  .funnel { display: grid; gap: 8px; }

  .funnel-step { display: grid; gap: 5px; }

  .funnel-bar-wrap {
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--bg);
    border: 1px solid var(--line);
    overflow: hidden;
    position: relative;
  }

  .funnel-bar-fill {
    height: 100%;
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    font-family: var(--font-mono);
    white-space: nowrap;
    transition: width 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .funnel-bar-fill.funnel-lead   { background: #3B82F6; }
  .funnel-bar-fill.funnel-active { background: #0EA5E9; }
  .funnel-bar-fill.funnel-done   { background: #16A34A; }

  .funnel-meta {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--muted);
  }

  .funnel-meta strong { color: var(--text); font-weight: 600; }

  .funnel-convert {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 11px;
    color: var(--muted);
    padding-left: 4px;
  }

  /* ── Ranking list ── */
  .ranking-list { display: grid; gap: 6px; }

  .ranking-row {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--panel);
  }

  .ranking-row-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  .ranking-row-name { font-size: 13px; font-weight: 600; }

  .ranking-row-sub {
    font-size: 11px;
    color: var(--muted);
    margin-top: 1px;
    font-family: var(--font-mono);
  }

  .ranking-bar {
    height: 4px;
    border-radius: 999px;
    background: var(--line);
    overflow: hidden;
  }

  .ranking-bar span {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--accent);
  }

  /* ── Insight list ── */
  .insight-list { display: grid; gap: 6px; }

  .insight-item {
    display: flex;
    align-items: flex-start;
    gap: 9px;
    padding: 10px 12px;
    border-radius: var(--radius-md);
    font-size: 13px;
    line-height: 1.5;
    border: 1px solid transparent;
  }

  .insight-item.info    { background: var(--info-soft);    border-color: #BFDBFE; }
  .insight-item.success { background: var(--success-soft); border-color: #BBF7D0; }
  .insight-item.warning { background: var(--warning-soft); border-color: #FDE68A; }

  .insight-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 5px;
  }

  .insight-item.info    .insight-dot { background: var(--info); }
  .insight-item.success .insight-dot { background: var(--success); }
  .insight-item.warning .insight-dot { background: var(--warning); }

  /* ── Recent projects ── */
  .stack-list { display: grid; gap: 6px; }

  .recent-row {
    display: grid;
    gap: 6px;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius-md);
    background: var(--panel);
  }

  .row-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .row-sub {
    font-size: 12px;
    color: var(--muted);
    margin-top: 1px;
  }

  .stats-row {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--font-mono);
  }

  /* ── Client table ── */
  .client-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }

  .client-table th {
    text-align: left;
    padding: 6px 10px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }

  .client-table th.num,
  .client-table td.num {
    text-align: right;
    font-family: var(--font-mono);
  }

  .client-table td {
    padding: 9px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: middle;
  }

  .client-table tr:last-child td { border-bottom: none; }

  .client-table tr:hover td { background: var(--bg); }

  .client-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    font-size: 10px;
    font-weight: 700;
    font-family: var(--font-mono);
    background: var(--bg);
    color: var(--muted);
    border: 1px solid var(--line);
  }

  .client-rank.gold   { background: #FFFBEB; color: #D97706; border-color: #FDE68A; }
  .client-rank.silver { background: #F8FAFC; color: #64748B; border-color: #CBD5E1; }
  .client-rank.bronze { background: #FFF7ED; color: #C2410C; border-color: #FED7AA; }

  .margin-pill {
    display: inline-flex;
    align-items: center;
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    font-family: var(--font-mono);
  }

  .margin-high { background: var(--success-soft); color: var(--success); }
  .margin-mid  { background: var(--info-soft);    color: var(--info); }
  .margin-low  { background: var(--danger-soft);  color: var(--danger); }

  /* ── Report grids ── */
  .report-grid-main  { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 14px; }
  .report-grid-equal { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .report-grid-full  { display: grid; gap: 14px; }

  /* ── Responsive ── */
  @media (max-width: 1280px) {
    .kpi-grid                    { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .kpi-grid-4                  { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi-grid-6                  { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .dashboard-grid-primary      { grid-template-columns: 1fr; }
    .report-grid-main            { grid-template-columns: 1fr; }
  }

  @media (max-width: 1100px) {
    .chart-grid { grid-template-columns: 1fr; }
  }

  @media (max-width: 920px) {
    .kpi-grid, .kpi-grid-4, .kpi-grid-6   { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dashboard-grid-secondary,
    .dashboard-grid-tertiary,
    .report-grid-equal,
    .status-grid                           { grid-template-columns: 1fr; }
    .attention-items                       { grid-template-columns: 1fr; }
  }

  @media (max-width: 600px) {
    .kpi-grid, .kpi-grid-4, .kpi-grid-6 { grid-template-columns: 1fr 1fr; }
  }
</style>
