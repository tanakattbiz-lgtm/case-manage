<style>
  :root {
    --color-bg: #F7F8FA;
    --color-surface: #FFFFFF;
    --color-surface-muted: #F3F4F6;
    --color-text: #111827;
    --color-text-subtle: #6B7280;
    --color-text-muted: #9CA3AF;
    --color-border: #E5E7EB;
    --color-border-strong: #D1D5DB;
    --color-black: #111111;
    --color-hover: #F3F4F6;
    --color-selected: #EEF2F7;
    --color-focus: #111827;
    --color-success: #166534;
    --color-success-bg: #ECFDF3;
    --color-warning: #92400E;
    --color-warning-bg: #FFFBEB;
    --color-error: #991B1B;
    --color-error-bg: #FEF2F2;
    --color-info: #1E40AF;
    --color-info-bg: #EFF6FF;

    --bg: var(--color-bg);
    --panel: var(--color-surface);
    --panel-muted: var(--color-surface-muted);
    --text: var(--color-text);
    --muted: var(--color-text-subtle);
    --line: var(--color-border);
    --line-strong: var(--color-border-strong);
    --select-bg: var(--color-selected);
    --accent: var(--color-black);
    --accent-hover: #2F2F2F;
    --accent-soft: var(--color-selected);
    --danger: var(--color-error);
    --danger-soft: var(--color-error-bg);
    --success: var(--color-success);
    --success-soft: var(--color-success-bg);
    --warning: var(--color-warning);
    --warning-soft: var(--color-warning-bg);
    --info: var(--color-info);
    --info-soft: var(--color-info-bg);
    --shadow-sm: 0 1px 2px rgba(17, 24, 39, 0.05);
    --shadow-md: 0 12px 28px rgba(17, 24, 39, 0.10);
    --shadow-glow: none;
    --radius-sm: 6px;
    --radius-md: 8px;
    --radius-lg: 8px;
    --font-body: "Inter", "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --font-mono: "Inter", "Noto Sans JP", system-ui, sans-serif;
  }

  html,
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-body);
    font-variant-numeric: tabular-nums;
  }

  h1,
  h2,
  h3,
  h4 {
    letter-spacing: 0;
    line-height: 1.3;
  }

  .surface,
  .form-section,
  .skeleton-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    box-shadow: var(--shadow-sm);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0;
  }

  .page-subtitle,
  p {
    color: var(--color-text-subtle);
    font-size: 13px;
  }

  .overline {
    color: var(--color-text-muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
  }

  .btn,
  .icon-btn,
  .segment-btn,
  .nav-btn,
  .nav-tab {
    border-radius: 6px;
    font-size: 13px;
    font-weight: 700;
  }

  .btn-primary {
    background: var(--color-black);
    border-color: var(--color-black);
    color: #fff;
  }

  .btn-primary:hover:not(:disabled) {
    background: #2F2F2F;
    border-color: #2F2F2F;
    transform: none;
    box-shadow: none;
  }

  .btn-secondary,
  .btn-danger {
    background: #fff;
    border: 1px solid var(--color-border-strong);
    color: var(--color-text);
    backdrop-filter: none;
    -webkit-backdrop-filter: none;
  }

  .btn-secondary:hover:not(:disabled),
  .icon-btn:hover:not(:disabled),
  .segment-btn:hover:not(:disabled),
  .nav-btn:hover:not(:disabled),
  .nav-tab:hover:not(:disabled) {
    background: var(--color-hover);
    transform: none;
  }

  .btn-danger {
    color: var(--color-error);
  }

  .input,
  .textarea,
  .select {
    min-height: 38px;
    border-radius: 6px;
    border-color: var(--color-border-strong);
    background-color: #fff;
    color: var(--color-text);
  }

  .field-label {
    color: var(--color-text);
    font-size: 12px;
    font-weight: 700;
  }

  .btn:focus-visible,
  .icon-btn:focus-visible,
  .segment-btn:focus-visible,
  .nav-btn:focus-visible,
  .nav-tab:focus-visible,
  .input:focus,
  .textarea:focus,
  .select:focus {
    outline: 2px solid var(--color-focus);
    outline-offset: 2px;
    box-shadow: none;
  }

  .sidebar {
    border-radius: 0;
    border-width: 0 1px 0 0;
  }

  .nav-btn.is-active,
  .nav-tab.is-active,
  .segment-btn.is-active,
  tr.is-selected {
    background: var(--color-selected);
    color: var(--color-text);
  }

  .section-card,
  .metric-card {
    border-radius: 8px;
  }

  .metric {
    font-size: 28px;
    font-weight: 700;
    letter-spacing: 0;
    font-variant-numeric: tabular-nums;
  }

  .data-table {
    font-size: 13px;
  }

  .data-table th {
    position: sticky;
    top: 0;
    z-index: 1;
    background: var(--color-surface-muted);
    color: var(--color-text-subtle);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .table-wrap {
    max-height: min(62vh, 680px);
    overflow: auto;
    border: 1px solid var(--color-border);
    border-radius: 8px;
  }

  .status-pill,
  .chip,
  .result-pill,
  .status-chip {
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }

  .modal-panel {
    background: #fff;
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-radius: 8px;
    box-shadow: 0 24px 60px rgba(17, 24, 39, 0.18);
  }

  #detailModal {
    place-items: stretch end;
    padding: 0;
  }

  #detailModal .modal-panel {
    width: min(560px, 100vw);
    max-height: 100svh;
    height: 100svh;
    border-radius: 0;
    animation: drawer-enter 180ms ease;
  }

  @keyframes drawer-enter {
    from { opacity: 0; transform: translateX(24px); }
    to { opacity: 1; transform: translateX(0); }
  }

  .toast-stack {
    top: 20px;
    right: 20px;
    bottom: auto;
  }

  .toast {
    background: #fff;
    color: var(--color-text);
    border: 1px solid var(--color-border);
    border-left: 4px solid var(--color-info);
    border-radius: 8px;
  }

  .toast.success { background: #fff; color: var(--color-text); border-left-color: var(--color-success); }
  .toast.error { background: #fff; color: var(--color-text); border-left-color: var(--color-error); }
  .toast.warning { background: #fff; color: var(--color-text); border-left-color: var(--color-warning); }

  .chart-canvas-wrap {
    position: relative;
    min-height: 280px;
  }

  .chart-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 16px;
  }

  .material-symbols-outlined {
    font-size: 20px;
    font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 20;
    line-height: 1;
  }

  @media (max-width: 1100px) {
    .chart-grid {
      grid-template-columns: 1fr;
    }
  }
</style>
