<script>
  (function (App) {
    App.dashboard = {
      bindEvents: function () {
        App.ui.qq('[data-dashboard-mode]').forEach(function (button) {
          button.addEventListener('click', function () {
            App.state.dashboard.filter.mode = button.dataset.dashboardMode;
            if (button.dataset.dashboardMode === 'year') {
              App.state.dashboard.filter.month = '';
            }
            if (button.dataset.dashboardMode === 'all') {
              App.state.dashboard.filter.year = '';
              App.state.dashboard.filter.month = '';
            }
            App.dashboard.ensureLoaded(false).catch(function () {});
          });
        });

        App.ui.byId('dashboardYear').addEventListener('change', function (event) {
          App.state.dashboard.filter.year = event.target.value;
          App.state.dashboard.filter.mode = event.target.value ? 'year' : 'all';
          App.dashboard.ensureLoaded(false).catch(function () {});
        });

        App.ui.byId('dashboardMonth').addEventListener('change', function (event) {
          App.state.dashboard.filter.month = event.target.value;
          if (event.target.value) {
            App.state.dashboard.filter.mode = 'month';
            if (!App.state.dashboard.filter.year) {
              App.state.dashboard.filter.year = String(new Date().getFullYear());
            }
          }
          App.dashboard.ensureLoaded(false).catch(function () {});
        });

        App.ui.byId('dashboardStatusGrid').addEventListener('click', function (event) {
          var button = event.target.closest('[data-dashboard-status]');
          if (!button) return;
          App.projects.applyScope({
            label: App.state.dashboard.data && App.state.dashboard.data.filter ? App.state.dashboard.data.filter.label : '',
            mode: App.state.dashboard.filter.mode,
            year: App.state.dashboard.filter.year,
            month: App.state.dashboard.filter.month,
            status: button.dataset.dashboardStatus
          });
        });
      },

      syncFilterControls: function () {
        var yearSelect = App.ui.byId('dashboardYear');
        var monthSelect = App.ui.byId('dashboardMonth');
        var currentYear = new Date().getFullYear();
        var years = [currentYear, currentYear - 1, currentYear - 2, currentYear - 3, currentYear - 4];

        yearSelect.innerHTML = '<option value="">すべての年</option>' + years.map(function (year) {
          var selected = App.state.dashboard.filter.year === String(year) ? ' selected' : '';
          return '<option value="' + year + '"' + selected + '>' + year + '年</option>';
        }).join('');

        monthSelect.innerHTML = '<option value="">すべての月</option>' + Array.from({ length: 12 }).map(function (_, index) {
          var month = String(index + 1).padStart(2, '0');
          var selected = App.state.dashboard.filter.month === month ? ' selected' : '';
          return '<option value="' + month + '"' + selected + '>' + (index + 1) + '月</option>';
        }).join('');

        App.ui.qq('[data-dashboard-mode]').forEach(function (button) {
          button.classList.toggle('is-active', button.dataset.dashboardMode === App.state.dashboard.filter.mode);
        });
      },

      ensureLoaded: async function (force) {
        var key = JSON.stringify(App.state.dashboard.filter);
        if (!force && App.state.dashboard.data && App.state.dashboard.loadedKey === key) {
          this.render();
          return App.state.dashboard.data;
        }

        App.state.dashboard.loading = true;
        try {
          var response = await DataLoader.getDashboard(App.state.dashboard.filter, { forceRefresh: Boolean(force) });
          App.state.dashboard.data = response;
          App.state.dashboard.loadedKey = key;
          App.state.dashboard.error = '';
          App.state.dashboard.stale = Boolean(response && response.__meta && response.__meta.stale);
          if (response && response.__meta) {
            App.ui.setLastSync(response.__meta.savedAt);
          }
          this.syncFilterControls();
          this.render();
          App.ui.updateBadges();
          return response;
        } catch (error) {
          App.state.dashboard.error = error.message || 'ダッシュボードの読み込みに失敗しました。';
          this.renderError();
          throw error;
        } finally {
          App.state.dashboard.loading = false;
        }
      },

      reload: async function () {
        try {
          await this.ensureLoaded(true);
          App.ui.toast('ダッシュボードを更新しました。', 'success');
        } catch (error) {}
      },

      /* ── ヘルパー ── */
      deltaBadge: function (current, prev) {
        if (!prev || prev === 0) return '';
        var delta = Math.round(((current - prev) / Math.abs(prev)) * 100);
        if (Math.abs(delta) < 1) return '<span class="delta-badge delta-flat">—</span>';
        var cls = delta >= 0 ? 'delta-up' : 'delta-down';
        var arrow = delta >= 0 ? '▲' : '▼';
        return '<span class="delta-badge ' + cls + '">' + arrow + ' ' + Math.abs(delta) + '%</span>';
      },

      deltaBadgePt: function (current, prev) {
        if (!prev && prev !== 0) return '';
        var delta = current - prev;
        if (Math.abs(delta) < 1) return '<span class="delta-badge delta-flat">—</span>';
        var cls = delta >= 0 ? 'delta-up' : 'delta-down';
        var arrow = delta >= 0 ? '▲' : '▼';
        return '<span class="delta-badge ' + cls + '">' + arrow + ' ' + Math.abs(delta) + 'pt</span>';
      },

      metricCard: function (title, value, caption, badge) {
        return ''
          + '<div class="surface metric-card">'
          + '<div class="metric-card-header">'
          + '<strong>' + App.helpers.escape(title) + '</strong>'
          + (badge || '')
          + '</div>'
          + '<div class="metric">' + App.helpers.escape(value) + '</div>'
          + '<footer>' + App.helpers.escape(caption) + '</footer>'
          + '</div>';
      },

      renderError: function () {
        var offline = String(App.state.dashboard.error || '').indexOf('オフライン') >= 0;
        App.ui.byId('dashboardMetrics').innerHTML = App.ui.renderStateBlock(
          offline ? 'オフラインのため最新情報を取得できません。' : 'ダッシュボードを表示できません。',
          App.state.dashboard.error,
          offline ? 'cloud-off' : 'error',
          '<button class="btn btn-secondary" type="button" data-action="refresh-dashboard">再試行</button>'
        );
      },

      renderFunnel: function (container, funnel) {
        if (!funnel || !funnel.length) {
          container.innerHTML = App.ui.renderStateBlock('データがありません。', '', 'info');
          return;
        }
        var maxCount = Math.max.apply(null, funnel.map(function (s) { return s.count; }).concat([1]));
        var colorClass = ['funnel-lead', 'funnel-active', 'funnel-done'];
        var html = '<div class="funnel">';
        funnel.forEach(function (step, i) {
          var pct = maxCount > 0 ? Math.max(8, Math.round((step.count / maxCount) * 100)) : 8;
          var convHtml = '';
          if (i > 0 && funnel[i - 1].count > 0) {
            var convRate = Math.round((step.count / funnel[i - 1].count) * 100);
            convHtml = '<div class="funnel-convert">↓ 転換率 ' + convRate + '%</div>';
          }
          html += ''
            + (i > 0 ? convHtml : '')
            + '<div class="funnel-step">'
            + '<div class="funnel-bar-wrap">'
            + '<div class="funnel-bar-fill ' + colorClass[i] + '" style="width:' + pct + '%">'
            + step.count + '件'
            + '</div>'
            + '</div>'
            + '<div class="funnel-meta">'
            + '<strong>' + App.helpers.escape(step.label) + '</strong>'
            + '<span>' + App.helpers.currency(step.sales) + '</span>'
            + '</div>'
            + '</div>';
        });
        html += '</div>';
        container.innerHTML = html;
      },

      renderAlerts: function (container, staleItems) {
        if (!staleItems || !staleItems.length) {
          container.innerHTML = '';
          return;
        }
        var html = ''
          + '<div class="attention-bar">'
          + '<div class="attention-bar-header">'
          + '<svg class="icon icon-16" aria-hidden="true"><use href="#icon-warning"></use></svg>'
          + '<strong>要確認 ' + staleItems.length + '件</strong>'
          + '<span>21日以上更新されていない進行中・商談中の案件</span>'
          + '</div>'
          + '<div class="attention-items">'
          + staleItems.map(function (item) {
              return ''
                + '<div class="attention-item">'
                + '<div class="attention-item-body">'
                + '<div class="attention-item-name">' + App.helpers.escape(item.name) + '</div>'
                + '<div class="attention-item-sub">'
                + '<span>' + App.helpers.escape(item.clientName || '—') + '</span>'
                + '<span class="status-pill ' + App.helpers.projectStatusClass(item.status) + '">' + App.helpers.escape(item.status) + '</span>'
                + '</div>'
                + '</div>'
                + '<span class="days-badge">' + item.daysSince + '日</span>'
                + '</div>';
            }).join('')
          + '</div>'
          + '</div>';
        container.innerHTML = html;
      },

      render: function () {
        var data = App.state.dashboard.data;
        if (!data) return this.renderError();

        App.ui.byId('dashboardPeriodLabel').textContent = data.filter.label + (App.state.dashboard.stale ? ' ／ キャッシュ表示' : '');

        /* ── KPI カード ── */
        var comp = data.comparison || {};
        var compLabel = data.filter.mode === 'month' ? '前月比' : (data.filter.mode === 'year' ? '前年比' : '');
        App.ui.byId('dashboardMetrics').innerHTML = [
          this.metricCard('確定売上', App.helpers.currency(data.summary.totalSales), '着手金＋完了残額' + (compLabel ? ' / ' + compLabel : ''),
            comp.totalSales != null ? this.deltaBadge(data.summary.totalSales, comp.totalSales) : ''),
          this.metricCard('確定利益', App.helpers.currency(data.summary.totalProfit), '着手金＋完了残額' + (compLabel ? ' / ' + compLabel : ''),
            comp.totalProfit != null ? this.deltaBadge(data.summary.totalProfit, comp.totalProfit) : ''),
          this.metricCard('平均利益率', App.helpers.pct(data.summary.avgMargin), '確定案件平均' + (compLabel ? ' / ' + compLabel : ''),
            comp.avgMargin != null ? this.deltaBadgePt(data.summary.avgMargin, comp.avgMargin) : ''),
          this.metricCard('パイプライン', App.helpers.currency(data.summary.pipelineSales), '進行中 + 商談中' + (compLabel ? ' / ' + compLabel : ''),
            comp.pipelineSales != null ? this.deltaBadge(data.summary.pipelineSales, comp.pipelineSales) : ''),
          this.metricCard('平均リードタイム', data.summary.avgLeadDays > 0 ? data.summary.avgLeadDays + ' 日' : '—', '受注〜完了の平均日数', ''),
        ].join('');

        /* ── 要確認アラート ── */
        this.renderAlerts(App.ui.byId('dashboardAlerts'), data.staleItems);

        /* ── ステータスサマリー ── */
        App.ui.byId('dashboardStatusGrid').innerHTML = App.constants.projectStatuses.map(function (status) {
          return ''
            + '<button class="status-card" type="button" data-dashboard-status="' + App.helpers.escape(status) + '">'
            + '<div class="status-card-label">' + App.helpers.escape(status) + '</div>'
            + '<strong class="metric">' + App.helpers.number(data.statusCount[status] || 0) + '</strong>'
            + '<div class="status-card-sales">' + App.helpers.currency(data.statusSales[status] || 0) + '</div>'
            + '</button>';
        }).join('');

        /* ── チャート ── */
        App.charts.renderTrend('dashboardTrend', data.monthly);
        App.charts.renderDoughnut('dashboardStatusChart', App.constants.projectStatuses.map(function (status) {
          return { label: status, count: data.statusCount[status] || 0, sales: data.statusSales[status] || 0 };
        }));
        App.charts.renderHorizontalBars('dashboardOwnerChart', (data.clientRanking || []).map(function (item) {
          return { label: item.name, count: item.count || 0 };
        }), 'count');

        /* ── ファネル ── */
        this.renderFunnel(App.ui.byId('dashboardFunnel'), data.funnel);

        /* ── クライアントランキング ── */
        App.ui.byId('dashboardRanking').innerHTML = data.clientRanking.length
          ? data.clientRanking.map(function (item) {
              var width = Math.max(6, Math.round(((Number(item.sales) || 0) / Math.max(1, data.clientRanking[0].sales || 1)) * 100));
              return ''
                + '<div class="ranking-row">'
                + '<div class="ranking-row-head">'
                + '<div>'
                + '<div class="ranking-row-name">' + App.helpers.escape(item.name) + '</div>'
                + '<div class="ranking-row-sub">' + App.helpers.currency(item.sales) + ' ／ 利益率 ' + item.margin + '%</div>'
                + '</div>'
                + '<span class="delta-badge delta-flat">' + item.count + '件</span>'
                + '</div>'
                + '<div class="ranking-bar"><span style="width:' + width + '%;"></span></div>'
                + '</div>';
            }).join('')
          : App.ui.renderStateBlock('データがありません。', '完了案件が増えると表示されます。', 'info');

        /* ── インサイト ── */
        App.ui.byId('dashboardInsights').innerHTML = (data.insights || []).map(function (item) {
          var type = (item && item.type) ? item.type : 'info';
          var text = (item && item.text) ? item.text : String(item || '');
          return ''
            + '<div class="insight-item ' + type + '">'
            + '<span class="insight-dot"></span>'
            + '<span>' + App.helpers.escape(text) + '</span>'
            + '</div>';
        }).join('');

        /* ── 最近の完了案件 ── */
        App.ui.byId('dashboardRecent').innerHTML = data.recent.length
          ? data.recent.map(function (project) {
              return ''
                + '<div class="recent-row">'
                + '<div class="row-head">'
                + '<div><strong>' + App.helpers.escape(project.name) + '</strong><div class="row-sub">' + App.helpers.escape(project.clientName || '—') + '</div></div>'
                + '<span class="status-pill ' + App.helpers.projectStatusClass(project.status) + '">' + App.helpers.escape(project.status) + '</span>'
                + '</div>'
                + '<div class="stats-row">'
                + '<span>売上 ' + App.helpers.currency(project.sales) + '</span>'
                + '<span>利益 ' + App.helpers.currency(project.profit) + '</span>'
                + '<span>完了 ' + App.helpers.dateLabel(project.completedAt) + '</span>'
                + '</div>'
                + '</div>';
            }).join('')
          : App.ui.renderStateBlock('完了案件はまだありません。', '案件を完了にするとここへ表示されます。', 'info');
      }
    };
  })(window.App);
</script>
