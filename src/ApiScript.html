<script>
  (function (App) {
    App.cache = {
      loadStore: function () {
        try {
          return JSON.parse(localStorage.getItem(App.constants.cacheKey) || '{}');
        } catch (error) {
          return {};
        }
      },
      saveStore: function (store) {
        try {
          localStorage.setItem(App.constants.cacheKey, JSON.stringify(store || {}));
        } catch (error) {
        }
      },
      read: function (key) {
        if (!key) return null;
        var store = this.loadStore();
        return store[key] || null;
      },
      write: function (key, value) {
        if (!key) return;
        var store = this.loadStore();
        store[key] = {
          data: value,
          savedAt: new Date().toISOString()
        };
        this.saveStore(store);
      }
    };

    App.api = (function () {
      function normalizeError(error) {
        var raw = String((error && error.message) || error || 'エラーが発生しました。');
        var separator = raw.indexOf(':');
        if (separator > 0) {
          return {
            code: raw.slice(0, separator).trim(),
            message: raw.slice(separator + 1).trim() || raw
          };
        }
        return { code: 'APP_ERROR', message: raw };
      }

      function attachMeta(result, meta) {
        if (result && typeof result === 'object') {
          result.__meta = meta;
        }
        return result;
      }

      function call(method, args, options) {
        var config = Object.assign({ secure: true }, options || {});
        var finalArgs = (args || []).slice();
        if (config.secure) {
          finalArgs.unshift(App.state.auth.token);
        }

        return new Promise(function (resolve, reject) {
          var runner = google.script.run
            .withSuccessHandler(function (result) {
              if (result && typeof result === 'object' && Object.prototype.hasOwnProperty.call(result, 'ok')) {
                if (result.ok) {
                  resolve(result.data);
                  return;
                }
                var apiError = result.error || { code: 'APP_ERROR', message: '処理に失敗しました。' };
                if (config.secure && (apiError.code === 'AUTH_REQUIRED' || apiError.code === 'AUTH_EXPIRED')) {
                  if (App.auth && typeof App.auth.handleSessionLoss === 'function') {
                    App.auth.handleSessionLoss(apiError.message);
                  }
                }
                reject(apiError);
                return;
              }
              resolve(result);
            })
            .withFailureHandler(function (error) {
              var normalized = normalizeError(error);
              if (config.secure && (normalized.code === 'AUTH_REQUIRED' || normalized.code === 'AUTH_EXPIRED')) {
                if (App.auth && typeof App.auth.handleSessionLoss === 'function') {
                  App.auth.handleSessionLoss(normalized.message);
                }
              }
              reject(normalized);
            });
          runner[method].apply(runner, finalArgs);
        });
      }

      async function read(method, args, options) {
        var config = Object.assign({ secure: true, cacheKey: '', allowStale: true }, options || {});
        var cached = config.cacheKey ? App.cache.read(config.cacheKey) : null;

        if (!App.state.ui.online) {
          if (cached && cached.data) {
            return attachMeta(cached.data, { stale: true, savedAt: cached.savedAt, source: 'cache' });
          }
          throw { code: 'OFFLINE', message: 'オフラインのため通信できません。再接続後に再試行してください。' };
        }

        try {
          var result = await call(method, args, config);
          if (config.cacheKey) {
            App.cache.write(config.cacheKey, result);
          }
          return attachMeta(result, { stale: false, savedAt: new Date().toISOString(), source: 'network' });
        } catch (error) {
          if (config.allowStale && cached && cached.data) {
            return attachMeta(cached.data, { stale: true, savedAt: cached.savedAt, source: 'cache', fallback: true });
          }
          throw error;
        }
      }

      return {
        rpc: call,
        read: read,
        auth: {
          getAuthState: function (token) {
            return call('getAuthState', [token], { secure: false });
          },
          login: function (payload) {
            return call('login', [payload], { secure: false });
          },
          bootstrapAdmin: function (payload) {
            return call('bootstrapAdmin', [payload], { secure: false });
          },
          logout: function () {
            return call('logout', []);
          },
          changePassword: function (currentPassword, nextPassword) {
            return call('changeMyPassword', [currentPassword, nextPassword]);
          }
        },
        dashboard: {
          get: function (filter) {
            return read('api_getDashboardData', [filter], { cacheKey: 'dashboard:' + JSON.stringify(filter || {}) });
          }
        },
        projects: {
          list: function (query) {
            return read('api_searchCases', [query || {}], { cacheKey: 'projects:list:' + JSON.stringify(query || {}) });
          },
          detail: function (projectId) {
            return read('api_getCaseDetail', [{ caseId: projectId }], { cacheKey: 'projects:detail:' + String(projectId || '') });
          },
          create: function (payload) {
            return call('api_saveCase', [payload]);
          },
          update: function (payload) {
            return call('api_saveCase', [payload]);
          },
          remove: function (projectId) {
            return call('api_deleteCase', [{ caseId: projectId }]);
          }
        },
        clients: {
          list: function (query) {
            return read('api_searchClients', [query || {}], { cacheKey: 'clients:list:' + JSON.stringify(query || {}) });
          },
          options: function () {
            return read('getClientOptions', [], { cacheKey: 'clients:options' });
          },
          detail: function (clientId) {
            return read('api_getClientDetail', [{ clientId: clientId }], { cacheKey: 'clients:detail:' + String(clientId || '') });
          },
          create: function (payload) {
            return call('addClient', [payload]);
          },
          update: function (payload) {
            return call('updateClient', [payload]);
          },
          remove: function (clientId) {
            return call('deleteClient', [clientId]);
          }
        },
        users: {
          list: function (query) {
            return read('getUsers', [query || {}], { cacheKey: 'users:list:' + JSON.stringify(query || {}) });
          },
          detail: function (userId) {
            return read('getUserDetail', [userId], { cacheKey: 'users:detail:' + String(userId || '') });
          },
          save: function (payload) {
            return call('saveUser', [payload]);
          },
          unlock: function (userId) {
            return call('unlockUser', [userId]);
          },
          audits: function (query) {
            return read('getAuditLogs', [query || {}], { cacheKey: 'users:audits:' + JSON.stringify(query || {}) });
          }
        }
      };
    })();

    window.ApiClient = {
      getInitialData: function () { return App.api.rpc('api_getInitialData', []); },
      searchCases: function (condition) { return App.api.rpc('api_searchCases', [condition || {}]); },
      getCaseDetail: function (caseId) { return App.api.rpc('api_getCaseDetail', [{ caseId: caseId }]); },
      saveCase: function (payload) { return App.api.rpc('api_saveCase', [payload || {}]); },
      deleteCase: function (caseId) { return App.api.rpc('api_deleteCase', [{ caseId: caseId }]); },
      getDashboardData: function (condition) { return App.api.rpc('api_getDashboardData', [condition || App.state.dashboard.filter || {}]); },
      searchClients: function (condition) { return App.api.rpc('api_searchClients', [condition || {}]); },
      getClientDetail: function (clientId) { return App.api.rpc('api_getClientDetail', [{ clientId: clientId }]); },
      saveClient: function (payload) { return payload && payload.id ? App.api.rpc('updateClient', [payload]) : App.api.rpc('addClient', [payload || {}]); },
      deleteClient: function (clientId) { return App.api.rpc('deleteClient', [clientId]); },
      getReportData: function (condition) { return App.api.rpc('api_getReportData', [condition || {}]); }
    };

    window.Store = {
      currentUser: null,
      masterData: null,
      dashboard: { data: null, fetchedAt: null, stale: true, byQueryKey: {} },
      cases: { byQueryKey: {}, selectedCaseId: null, lastCondition: null },
      caseDetails: { byId: {} },
      clients: { byQueryKey: {}, byId: {} },
      reports: { byQueryKey: {} },
      ui: {
        activeRoute: 'dashboard',
        activeTab: null,
        loadingKeys: {},
        errors: {},
        modals: [],
        drawer: null,
        toastQueue: [],
        scrollPositions: {}
      }
    };

    window.createQueryKey = function (condition) {
      var input = condition || {};
      return JSON.stringify({
        keyword: input.keyword || input.query || '',
        status: input.status || '',
        assignee: input.assignee || '',
        from: input.from || input.dateFrom || '',
        to: input.to || input.dateTo || '',
        page: input.page || 1,
        pageSize: input.pageSize || 50,
        sortKey: input.sortKey || 'updatedAt',
        sortOrder: input.sortOrder || 'desc',
        clientId: input.clientId || '',
        scope: input.scope || null,
        mode: input.mode || '',
        year: input.year || '',
        month: input.month || ''
      });
    };

    window.DataLoader = {
      loadOnce: function (loadingKey, cacheGetter, cacheSetter, requestFn, options) {
        var config = options || {};
        var cached = cacheGetter();
        if (cached && !config.forceRefresh) return Promise.resolve(cached);
        if (Store.ui.loadingKeys[loadingKey]) return Store.ui.loadingKeys[loadingKey];

        var promise = requestFn()
          .then(function (data) {
            cacheSetter(data);
            delete Store.ui.errors[loadingKey];
            return data;
          })
          .catch(function (error) {
            Store.ui.errors[loadingKey] = error;
            throw error;
          })
          .finally(function () {
            delete Store.ui.loadingKeys[loadingKey];
          });

        Store.ui.loadingKeys[loadingKey] = promise;
        return promise;
      },

      getDashboard: function (condition, options) {
        var key = createQueryKey(condition || {});
        return this.loadOnce(
          'dashboard:' + key,
          function () { return Store.dashboard.byQueryKey[key]; },
          function (data) {
            Store.dashboard.byQueryKey[key] = data;
            Store.dashboard.data = data;
            Store.dashboard.fetchedAt = new Date().toISOString();
            Store.dashboard.stale = false;
          },
          function () { return ApiClient.getDashboardData(condition || {}); },
          options
        );
      },

      searchCases: function (condition, options) {
        var key = createQueryKey(condition || {});
        return this.loadOnce(
          'cases:' + key,
          function () { return Store.cases.byQueryKey[key]; },
          function (data) {
            Store.cases.byQueryKey[key] = data;
            Store.cases.lastCondition = condition || {};
          },
          function () { return ApiClient.searchCases(condition || {}); },
          options
        );
      },

      getCaseDetail: function (caseId, options) {
        return this.loadOnce(
          'caseDetail:' + caseId,
          function () { return Store.caseDetails.byId[caseId]; },
          function (data) { Store.caseDetails.byId[caseId] = data; },
          function () { return ApiClient.getCaseDetail(caseId); },
          options
        );
      },

      searchClients: function (condition, options) {
        var key = createQueryKey(condition || {});
        return this.loadOnce(
          'clients:' + key,
          function () { return Store.clients.byQueryKey[key]; },
          function (data) { Store.clients.byQueryKey[key] = data; },
          function () { return ApiClient.searchClients(condition || {}); },
          options
        );
      },

      getClientDetail: function (clientId, options) {
        return this.loadOnce(
          'clientDetail:' + clientId,
          function () { return Store.clients.byId[clientId]; },
          function (data) { Store.clients.byId[clientId] = data; },
          function () { return ApiClient.getClientDetail(clientId); },
          options
        );
      },

      getReportData: function (condition, options) {
        var key = createQueryKey(condition || {});
        return this.loadOnce(
          'reports:' + key,
          function () { return Store.reports.byQueryKey[key]; },
          function (data) { Store.reports.byQueryKey[key] = data; },
          function () { return ApiClient.getReportData(condition || {}); },
          options
        );
      },

      invalidateCases: function (caseId) {
        Store.cases.byQueryKey = {};
        if (caseId) delete Store.caseDetails.byId[caseId];
        Store.dashboard.byQueryKey = {};
        Store.dashboard.data = null;
        Store.dashboard.stale = true;
        if (window.App && App.state && App.state.dashboard) {
          App.state.dashboard.data = null;
          App.state.dashboard.loadedKey = '';
          App.state.dashboard.stale = true;
        }
      },

      invalidateClients: function (clientId) {
        Store.clients.byQueryKey = {};
        if (clientId) delete Store.clients.byId[clientId];
        Store.dashboard.byQueryKey = {};
        Store.dashboard.data = null;
        Store.dashboard.stale = true;
        if (window.App && App.state && App.state.dashboard) {
          App.state.dashboard.data = null;
          App.state.dashboard.loadedKey = '';
          App.state.dashboard.stale = true;
        }
      },

      invalidateReports: function () {
        Store.reports.byQueryKey = {};
      }
    };
  })(window.App);
</script>
